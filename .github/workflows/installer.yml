name: Installer release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in manually built binaries
        required: true
        default: dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test native installer
        working-directory: installer
        run: go test ./...
      - name: Test graph viewer
        working-directory: graph
        run: go test ./...
      - name: Test compatibility launcher
        run: python3 -m unittest installer/test_bootstrap.py
      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: python3 installer/release.py --output-dir dist/installer --version "$RELEASE_VERSION"
      - name: Build graph viewer release assets
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: python3 graph/release.py --output-dir dist/graph --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: docket-native-binaries
          path: |
            dist/installer/*
            dist/graph/*
      - name: Upload assets to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/installer/* dist/graph/* --clobber
